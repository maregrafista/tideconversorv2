<section id="compare" class="panel" role="tabpanel" aria-labelledby="tab-compare" hidden>
  <div class="sectionhead"><div><h2>Previsto × observado</h2><p class="sub">Erro de altura nas preamares e baixamares de Fazendinha</p></div>
    <div class="cmp-dl"><button class="textbutton" id="cmpCsv">CSV do período</button><button class="textbutton" id="cmpCsvAll">CSV de tudo</button></div></div>

  <div class="cmp-ctl">
    <select id="cmpPresets" aria-label="Período de exemplo"></select>
    <div class="cmp-nav"><button class="step" id="cmpPrev" type="button" aria-label="Período anterior">‹</button><input type="date" id="cmpDate" aria-label="Primeiro dia"><button class="step" id="cmpNext" type="button" aria-label="Próximo período">›</button></div>
    <div class="chips" id="cmpLen" role="group" aria-label="Duração"></div>
    <span class="cmp-tag" id="cmpTag"></span>
  </div>

  <div class="cmp-grid">
    <figure class="card fig cmp-left">
      <canvas id="cmpOv" height="96" aria-label="Nível médio diário observado e previsto em todo o registro"></canvas>
      <div class="cmp-chart" id="cmpWrap">
        <canvas id="cmpMain" height="260" aria-label="Nível observado e previsto"></canvas>
        <canvas id="cmpErr" height="110" aria-label="Erro de altura nas preamares e baixamares"></canvas>
        <div class="cmp-cursor" id="cmpCursor" hidden></div><div class="cmp-tip" id="cmpTip" hidden></div>
      </div>
      <div class="cmp-legend"><span><i style="background:var(--ink,#1c1c1c)"></i>Observado</span><span><i style="background:#009E73"></i>Previsto</span><span><i class="dot" style="background:var(--ink,#1c1c1c)"></i>PM/BM observada</span><span><i class="dot ring"></i>PM/BM prevista</span><span><i class="dot" style="background:var(--c-pm,#D55E00)"></i>erro preamar</span><span><i class="tri" style="color:var(--c-bm,#0072B2)"></i>erro baixamar</span></div>
      <figcaption class="fig-cap">Em cima, todo o registro (média diária; toque para mover a faixa marrom; cinza = ajuste). (a) Período escolhido. (b) Erro de altura nas preamares e baixamares (acima de zero = previsto acima).</figcaption>
    </figure>

    <div class="cmp-right">
      <div class="cmp-cards" id="cmpCards" aria-live="polite"></div>
      <p class="cmp-all" id="cmpSummary"></p>
      <figure class="card fig"><canvas id="cmpMonths" height="150" aria-label="Erro típico por mês"></canvas>
        <div class="cmp-legend"><span><i style="background:#009E73"></i>teste</span><span><i style="background:#8a9590"></i>ajuste</span><span><i style="background:#E69F00"></i>registro irregular</span></div>
        <figcaption class="fig-cap">Erro típico por mês (cm). Toque em um ponto para abrir o mês.</figcaption></figure>
    </div>
  </div>

  <details class="cmp-table"><summary id="cmpEvTitle">Preamares e baixamares do período</summary>
    <div class="cmp-evhead"><button class="chip" id="cmpAll" type="button">Ver todas as marés do registro</button></div>
    <div class="tablewrap"><table id="cmpEvents"></table></div></details>
</section>
